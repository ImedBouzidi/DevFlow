server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: auth-register-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devflow}
    username: ${DB_USERNAME:devflow}
    password: ${DB_PASSWORD:devflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/devflow}

keycloak:
  admin-base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:devflow}
  client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:devflow-auth-service}
  client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  default-role: ${KEYCLOAK_DEFAULT_ROLE:ROLE_SUPPORT}
  admin-seed-username: ${ADMIN_SEED_USERNAME:}
  admin-seed-email: ${ADMIN_SEED_EMAIL:}
  admin-seed-password: ${ADMIN_SEED_PASSWORD:}
  admin-seed-role: ${ADMIN_SEED_ROLE:ROLE_ADMIN}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
