name: devflow-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devflow_auth}
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devflow-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-bootstrap:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["sh", "/scripts/create-databases.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-devflow_auth}
      INCIDENT_DB_NAME: ${INCIDENT_DB_NAME:-devflow}
    volumes:
      - ./postgres/create-databases.sh:/scripts/create-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-9091}:8080"
    volumes:
      - ./keycloak/devflow-realm.json:/opt/keycloak/data/import/devflow-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; timeout 3 cat <&3 | grep -q 'UP'"
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 35s

  discovery-server:
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/discovery-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8761/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 35s

  auth-register-service:
    build:
      context: ..
      dockerfile: auth-register-service/Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/auth-register-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${AUTH_DB_NAME:-devflow_auth}
      DB_USERNAME: ${POSTGRES_USER:-devflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      EUREKA_SERVICE_URL: http://discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-9091}/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: devflow
      KEYCLOAK_WEB_CLIENT_ID: devflow-web
      KEYCLOAK_ADMIN_CLIENT_ID: devflow-auth-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-4KPGLJd8adlHLwVWckUSYp3voTeDOF8S}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@devflow.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Devflow123!}
      ADMIN_SEED_ROLE: ROLE_ADMIN
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 70s

  incident-service:
    build:
      context: ..
      dockerfile: incident-service/Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/incident-service:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${INCIDENT_DB_NAME:-devflow}
      DB_USERNAME: ${POSTGRES_USER:-devflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      EUREKA_SERVICE_URL: http://discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-9091}/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 70s

  ai-analysis-server:
    build:
      context: ../ai-analysis-server
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/ai-analysis-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_ENV: production
      API_PREFIX: /api/v1
      MODEL_DIR: /app/ml-models
      EAGER_LOAD_MODELS: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/ready', timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 8
      start_period: 100s

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/api-gateway:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVICE_URL: http://discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-9091}/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${GATEWAY_PORT:-9090}:9090"
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-register-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      ai-analysis-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 50s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-devflow}/frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  devflow-postgres-data:
